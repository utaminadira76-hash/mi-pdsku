services:
  # === Product Service (Bawaan Kelas) ===
  product-service:
    build: ./product-service
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=product-db
      - DB_USER=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=productdb
    depends_on:
      product-db:
        condition: service_healthy

  product-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=productdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  # === Cart Service (Kita ubah ke MySQL) ===
  cart-service:
    build: ./cart-service
    ports:
      - "3002:3002"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:3002
      - DB_CONNECTION=mysql
      - DB_HOST=cart-db
      - DB_PORT=3306
      - DB_DATABASE=cart_service
      - DB_USERNAME=cart_user
      - DB_PASSWORD=secret
    depends_on:
      cart-db:
        condition: service_healthy

  cart-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=cart_service
      - MYSQL_USER=cart_user
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - cart-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  # === Order Service (Tugas UTS) ===
  order-service:
    build: ./order-service
    ports:
      - "3003:3003"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:3003
      - DB_CONNECTION=mysql
      - DB_HOST=order-db
      - DB_PORT=3306
      - DB_DATABASE=order_service
      - DB_USERNAME=order_user
      - DB_PASSWORD=secret
      - PRODUCT_SERVICE_URL=http://product-service:3000
      - CART_SERVICE_URL=http://cart-service:3002
      - SERVICE_TIMEOUT=5
    depends_on:
      order-db:
        condition: service_healthy
      cart-service:
        condition: service_started
      product-service:
        condition: service_started

  order-db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=order_service
      - MYSQL_USER=order_user
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--user=root", "--password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

volumes:
  product-db-data:
  cart-db-data:
  order-db-data: